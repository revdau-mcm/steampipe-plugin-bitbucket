name: PR Build Validation (steampipe-plugin-bitbucket)

on:
  pull_request:
    branches:
      - develop
      - qa
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Go Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests with Coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build Static Binary Test
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "netgo" -ldflags="-s -w" -o steampipe-plugin-bitbucket.plugin *.go
          ls -lh steampipe-plugin-bitbucket.plugin

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Tests with Coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Download and install SonarScanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          python3 -m zipfile -e sonar-scanner.zip .
          chmod -R +x sonar-scanner-5.0.1.3006-linux/
          echo "$PWD/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_PARAMS="-Dsonar.branch.name=${{ github.head_ref }} -Dsonar.branch.target=${{ github.base_ref }}"
          else
            BRANCH_PARAMS="-Dsonar.branch.name=${{ github.ref_name }}"
          fi

          ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
            -Dsonar.projectKey=steampipe-plugin-bitbucket \
            -Dsonar.projectName="Steampipe Plugin Bitbucket" \
            -Dsonar.sources=. \
            -Dsonar.tests=. \
            -Dsonar.test.inclusions="**/*_test.go" \
            -Dsonar.exclusions=".git/**,*.plugin" \
            -Dsonar.go.coverage.reportPaths=coverage.out \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            $BRANCH_PARAMS
